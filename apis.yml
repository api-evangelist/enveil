aid: enveil
name: Enveil
description: >-
  Enveil is a privacy-enhancing technologies (PETs) company whose ZeroReveal
  platform lets organizations securely use, search, and analyze data while it is
  being processed, without moving, replicating, or exposing it. Built on
  homomorphic encryption, secure multiparty computation, and trusted execution
  environments, ZeroReveal Search delivers encrypted search, analytics, and
  watchlisting as a point-to-point proxy layer, while ZeroReveal Machine Learning
  provides encrypted training (SMPC-based federated learning) and encrypted model
  evaluation. Enveil serves financial services, healthcare and insurance,
  government and public sector, and secure-AI use cases spanning cross-silo data
  collaboration, fraud detection, secure data monetization, and privacy-preserving
  AI. The company was surfaced as a portfolio company of bloomberg-beta.
